<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AADM stories — patterns from the field">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a0e1a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#05040a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="amber" cx="90%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldBL" cx="5%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,0.08)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <rect width="1200" height="630" fill="url(#amber)"/>
  <rect width="1200" height="630" fill="url(#emeraldBL)"/>

  <!-- Marginalia -->
  <line x1="120" y1="80" x2="120" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="64" y="100" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(252,211,77,0.7)" letter-spacing="3">§ 00</text>
  <text x="64" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">STORIES</text>

  <!-- Pre-heading -->
  <text x="160" y="125" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(252,211,77,0.85)" letter-spacing="3">▸ 21 VIGNETTES · MAY 2026 → JUNE 2026 · AGENT SESSIONS</text>

  <!-- Headline -->
  <text x="160" y="255" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="106" font-weight="900" fill="#ffffff" letter-spacing="-4">Patterns</text>
  <text x="160" y="365" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="92" font-weight="200" font-style="italic" fill="rgba(148,163,184,0.9)" letter-spacing="-2.5">from the field.</text>

  <!-- Portfolio band -->
  <line x1="160" y1="405" x2="220" y2="405" stroke="rgba(110,231,183,0.7)" stroke-width="2"/>
  <text x="160" y="445" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">PORTFOLIO BAND</text>
  <text x="160" y="510" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-2">~509<tspan fill="rgba(148,163,184,0.6)">–</tspan>775</text>
  <text x="445" y="510" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">ENGINEER-HOURS</text>
  <text x="445" y="530" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">REDIRECTED</text>

  <!-- Colophon -->
  <line x1="160" y1="568" x2="1040" y2="568" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(252,211,77,0.85)" letter-spacing="3">aadm.io/case-studies</text>
  <text x="780" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">FICTIONAL APPS · REAL PATTERNS</text>
