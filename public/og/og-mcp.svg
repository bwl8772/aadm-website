<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Connect to the AADM MCP">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0a1622" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#05040a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emerald" cx="100%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,0.08)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <rect width="1200" height="630" fill="url(#emerald)"/>

  <!-- Marginalia -->
  <line x1="120" y1="80" x2="120" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="64" y="100" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(110,231,183,0.7)" letter-spacing="3">§ 00</text>
  <text x="64" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">HOSTED MCP</text>

  <!-- Pre-heading -->
  <text x="160" y="125" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">▸ SUBSCRIBER SERVICE · STREAMABLE HTTP</text>

  <!-- Headline -->
  <text x="160" y="260" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-3.5">Connect to the</text>
  <text x="160" y="380" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="120" font-weight="900" fill="#6ee7b7" letter-spacing="-4">AADM MCP.</text>
  <rect x="160" y="358" width="690" height="14" fill="rgba(110,231,183,0.3)"/>

  <!-- Subtagline -->
  <text x="160" y="455" font-family="Plus Jakarta Sans, ui-sans-serif, sans-serif" font-size="24" font-weight="400" fill="rgba(203,213,225,0.9)">One endpoint. Cursor · Claude Code · Windsurf · any MCP-capable IDE.</text>

  <!-- Code-style URL -->
  <rect x="160" y="490" width="500" height="48" fill="none" stroke="rgba(110,231,183,0.4)" stroke-width="1"/>
  <text x="180" y="522" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="600" fill="#6ee7b7" letter-spacing="0">https://mcp.aadm.io/mcp</text>

  <!-- Colophon -->
  <line x1="160" y1="568" x2="1040" y2="568" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">aadm.io/mcp</text>
  <text x="900" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">JSON-RPC · BEARER · OAUTH</text>
</svg>
