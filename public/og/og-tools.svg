<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AADM tools catalog">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0a1622" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#05040a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emerald" cx="20%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,0.08)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <rect width="1200" height="630" fill="url(#emerald)"/>

  <!-- Marginalia -->
  <line x1="120" y1="80" x2="120" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="64" y="100" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(110,231,183,0.7)" letter-spacing="3">§ 00</text>
  <text x="64" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">TOOLS</text>

  <!-- Pre-heading -->
  <text x="160" y="125" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">▸ 24 TYPED TOOLS · FIVE LANES · STRUCTURED JSON</text>

  <!-- Headline -->
  <text x="160" y="245" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-3">Every tool.</text>
  <text x="160" y="330" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="76" font-weight="200" font-style="italic" fill="rgba(148,163,184,0.9)" letter-spacing="-2">Every contract.</text>
  <text x="160" y="420" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="76" font-weight="900" fill="#6ee7b7" letter-spacing="-3">One catalog.</text>
  <rect x="160" y="403" width="466" height="10" fill="rgba(110,231,183,0.3)"/>

  <!-- Tool list as chips -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="0">
    <rect x="160" y="465" width="155" height="32" fill="none" stroke="rgba(110,231,183,0.3)"/>
    <text x="173" y="486">standard_brief</text>
    <rect x="325" y="465" width="125" height="32" fill="none" stroke="rgba(110,231,183,0.3)"/>
    <text x="338" y="486">route_lane</text>
    <rect x="460" y="465" width="145" height="32" fill="none" stroke="rgba(110,231,183,0.3)"/>
    <text x="473" y="486">debug_defect</text>
    <rect x="615" y="465" width="130" height="32" fill="none" stroke="rgba(110,231,183,0.3)"/>
    <text x="628" y="486">fetch_auth</text>
    <rect x="755" y="465" width="130" height="32" fill="none" stroke="rgba(110,231,183,0.3)"/>
    <text x="768" y="486">audit_run</text>
    <rect x="895" y="465" width="155" height="32" fill="none" stroke="rgba(110,231,183,0.3)"/>
    <text x="908" y="486">plan_delivery</text>
  </g>

  <!-- Colophon -->
  <line x1="160" y1="568" x2="1040" y2="568" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">aadm.io/tools</text>
  <text x="900" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">tools/list IS AUTHORITATIVE</text>
</svg>
