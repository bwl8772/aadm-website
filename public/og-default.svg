<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AADM — Agentic Authority Delivery Model">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a0e2b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#05040a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="10%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="90%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,0.08)"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Marginalia rail (mimics §00 in nav) -->
  <line x1="120" y1="80" x2="120" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="64" y="100" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(252,211,77,0.7)" letter-spacing="3">§ 00</text>
  <text x="64" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">AADM</text>

  <!-- Pre-heading dot+text -->
  <circle cx="160" cy="155" r="3" fill="rgba(110,231,183,0.85)"/>
  <text x="174" y="160" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(148,163,184,0.85)" letter-spacing="3">OPEN STANDARD · HOSTED MCP · STREAMABLE HTTP</text>

  <!-- H1 -->
  <text x="160" y="280" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-3">AADM</text>

  <!-- Subhead with italic counterpoint -->
  <text x="160" y="370" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">The standard your agents</text>
  <text x="160" y="425" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">load on </text>
  <text x="382" y="425" font-family="DM Sans, ui-sans-serif, sans-serif" font-size="46" font-weight="800" fill="#6ee7b7" letter-spacing="-1.5">every turn.</text>
  <rect x="382" y="412" width="246" height="9" fill="rgba(110,231,183,0.3)"/>

  <!-- Hairline accent -->
  <line x1="160" y1="475" x2="220" y2="475" stroke="rgba(110,231,183,0.5)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="160" y="510" font-family="Plus Jakarta Sans, ui-sans-serif, sans-serif" font-size="22" font-weight="400" fill="rgba(203,213,225,0.85)">Governance for AI coding agents · Cursor · Claude Code · any MCP-capable IDE</text>

  <!-- Footer colophon -->
  <line x1="160" y1="555" x2="1040" y2="555" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="585" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(110,231,183,0.85)" letter-spacing="3">aadm.io</text>
  <text x="540" y="585" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(148,163,184,0.7)" letter-spacing="3">STREAMABLE HTTP / MCP</text>
  <text x="900" y="585" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="rgba(252,211,77,0.7)" letter-spacing="3">OPEN STANDARD</text>
</svg>
